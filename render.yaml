# Render Blueprint: https://render.com/docs/blueprint-spec
# New -> Blueprint -> select this repository. Creates the API (Docker) and PostgreSQL.
services:
  - type: web
    name: digital-business-card
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digital-business-card-db
          property: connectionString
      - key: GRAPHQL_SANDBOX
        value: "true"

databases:
  - name: digital-business-card-db
    plan: free
    databaseName: business_card
